<html lang="en">
<head>
  <meta charset="utf-8" />
    <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Spore — Living Network</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
  <meta name="description" content="Spore — the Fungai Art living network. Wallet, contributions, calendar, and the apothecary in one portal."/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3"/>
    <link rel="alternate icon" type="image/png" href="/favicon.png?v=3"/>
    <link rel="apple-touch-icon" href="/fungi.png?v=3"/>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Fungai Art"/>
    <meta property="og:title" content="Spore · Living Network — Fungai Art"/>
    <meta property="og:description" content="The Fungai Art member portal — wallet, contributions, calendar, apothecary."/>
    <meta property="og:image" content="https://www.fungai.art/fungi.png?v=3"/>
    <meta property="og:url" content="https://www.fungai.art/community"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:image" content="https://www.fungai.art/fungi.png?v=3"/>

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=zodiak@400,500&f[]=geist-mono@400,500&display=swap" />

  <link rel="stylesheet" href="spore/styles-living.css" />
  <!-- Admin planning board. Own stylesheet so the board can move out of
       the Admin tab later without unpicking 75 KB of portal CSS. -->
  <link rel="stylesheet" href="admin/kanban.css" />
  <!-- Portal home as a fairy ring. Own stylesheet, portal tokens only. -->
  <link rel="stylesheet" href="portal/fairy-ring.css" />

  <!-- React 18.3.1, production UMD, vendored locally by scripts/build-community.cjs.
       Was react.development.js from unpkg: 1,162 KB, with every dev-only warning
       and validation path live on a member's first paint. These are 139 KB. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
<script src="/global-nav.js" defer></script>
<!-- Living mycelium background (cousin of /members) --><script src="/mycelium-field.js" data-variant="community" defer></script>
</head>
<body>
  <div id="root"></div>

  <!-- Supabase client (loads before JSX so SBclient is ready when components mount) -->
  <script src="/supabase-client.js"></script>

  <script src="spore/data.js"></script>
  <script src="spore/tweaks-panel.js"></script>
  <script src="spore/network-living.js"></script>
  <script src="spore/network-globe.js"></script>
  <!-- cobe (WebGL globe for the network) — local copy, see scripts/build-community.cjs -->
  <script type="module">import createGlobe from "/community/vendor/cobe.esm.js"; window.createGlobe = createGlobe; window.dispatchEvent(new Event("cobe:ready"));</script>

  <!-- MYCO — its own folder now. Loaded BEFORE app-living because
       app-living references the global window.MycoAgent. See
       /community/myco/README.md for the folder plan + roadmap. -->
  <script src="myco/prompts.js"></script>
  <script src="myco/context.js"></script>
  <script src="myco/agent.js"></script>

  <!-- Admin planning board — sets window.AdminKanban, so like the MYCO
       scripts above it must load BEFORE app-living, which shims it. -->
  <script src="admin/kanban.js"></script>

  <!-- The fairy ring. sections.js must come first (the other two read
       window.PortalSections), and all three before app-living, which
       shims them the way it shims MycoAgent. -->
  <script src="portal/sections.js"></script>
  <script src="portal/organism.js"></script>
  <script src="portal/fairy-ring.js"></script>

  <script src="spore/app-living.js"></script>
<script src="claim-notice.js" defer></script>
<script src="/cookie-banner.js" defer></script>
<!-- page-view beacon · no cookie, no visitor id, honours DNT (public/visit.js) -->
<script src="/visit.js" defer></script>
</body>
</html>
