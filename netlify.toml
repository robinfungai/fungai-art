# Proxy /api/fyf/compose → the fyf-compose function. Named more
# specifically than the generic /api/* rule so the URL namespace
# stays consumer-friendly (/api/fyf/compose reads like a resource
# path, not an implementation detail). Must precede the /api/* rule.
[[redirects]]
  from   = "/api/fyf/compose"
  to     = "/.netlify/functions/fyf-compose"
  status = 200

# Step 5.5e · async MYCO upgrade for a stored formulaId.
[[redirects]]
  from   = "/api/fyf/upgrade"
  to     = "/.netlify/functions/fyf-upgrade"
  status = 200

# /patron and /sporing were absorbed into /members on 2026-09-23 (acts IX
# and X). 301 so the old links, and anything already indexed, land on the
# right part of the page instead of a 404.
[[redirects]]
  from   = "/patron"
  to     = "/members#patronage"
  status = 301
  force  = true

[[redirects]]
  from   = "/patron/*"
  to     = "/members#patronage"
  status = 301
  force  = true

[[redirects]]
  from   = "/patronage"
  to     = "/members#patronage"
  status = 301
  force  = true

[[redirects]]
  from   = "/sporing"
  to     = "/members#sporing"
  status = 301
  force  = true

[[redirects]]
  from   = "/sporing/*"
  to     = "/members#sporing"
  status = 301
  force  = true

# Page-view beacon → collect-visit. The function also declares
# config.path = '/api/visit', but the generic /api/* rule below would
# otherwise rewrite this to /.netlify/functions/visit — a name that does
# not exist. Named explicitly, like the fyf rules, and must precede /api/*.
[[redirects]]
  from   = "/api/visit"
  to     = "/.netlify/functions/collect-visit"
  status = 200

# Proxy /api/* to Netlify functions
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Edge especially requests /favicon.ico unconditionally even when the
# page links a different icon. Without an .ico response the browser
# falls back to whatever it had cached before — for sites originally
# built on Lovable, that's the Lovable default. Alias .ico → .svg.
[[redirects]]
  from   = "/favicon.ico"
  to     = "/favicon.svg"
  status = 200

# Root → new home design (force overrides the Vite-built /index.html that would otherwise win)
[[redirects]]
  from   = "/"
  to     = "/home/index.html"
  status = 200
  force  = true

# /products → /shop permanent redirect
[[redirects]]
  from   = "/products*"
  to     = "/shop"
  status = 301

# Foraging map SPA — serve foraging/index.html for /foraging
[[redirects]]
  from   = "/foraging"
  to     = "/foraging/index.html"
  status = 200

# Herbal Engine — serve herbal-engine-2/index.html for /herbal-engine-2
[[redirects]]
  from   = "/herbal-engine-2"
  to     = "/herbal-engine-2/index.html"
  status = 200
[[redirects]]
  from   = "/herbal-engine"
  to     = "/herbal-engine-2/"
  status = 301

# Dinner Experience — renamed from /mycelium-trance in 2026.
# Preserves old bookmarks, backlinks, sitemap crawls.
[[redirects]]
  from   = "/mycelium-trance/*"
  to     = "/dinner-experience/"
  status = 301
[[redirects]]
  from   = "/mycelium-trance"
  to     = "/dinner-experience/"
  status = 301

# $MYCEL reference basket — renamed from /basket to /mycel-basket
# so the word "basket" is no longer overloaded (it was clashing with
# the shopping cart in customer language).
[[redirects]]
  from   = "/basket/*"
  to     = "/mycel-basket/"
  status = 301
[[redirects]]
  from   = "/basket"
  to     = "/mycel-basket/"
  status = 301

# static pages served directly: /shop /mixology /dinner-experience /community /health /extraction /privacy /terms /members /sporing /draw /patron /basket /onboard

# Unknown paths → branded 404
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
