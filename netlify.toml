[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory      = "netlify/functions"
  node_bundler   = "esbuild"

# Edge functions — run at the CDN before the request hits the origin.
[[edge_functions]]
  function = "ip-block"
  path     = "/*"

# ─── Members-only surfaces · SEO lockdown ─────────────────────────
# Belt-and-braces to the robots.txt + <meta name="robots">: the CDN
# adds X-Robots-Tag: noindex on the actual response so crawlers that
# ignore both other signals still get told to bugger off. Applies to
# every response under these paths (index.html, sub-assets, functions).
[[headers]]
  for = "/community/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Referrer-Policy    = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options    = "SAMEORIGIN"
[[headers]]
  for = "/academy/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Referrer-Policy    = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options    = "SAMEORIGIN"
[[headers]]
  for = "/extraction/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Referrer-Policy    = "strict-origin-when-cross-origin"
[[headers]]
  for = "/alchemy/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/alchemy-academy/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/members/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/mycelium/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/mycel-basket/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/onboard/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/sporing/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/patron/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/draw/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/covenant/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive, nosnippet, noimageindex"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag       = "noindex, nofollow, noarchive"
    Cache-Control      = "no-store"

# Base security headers on every response (public + private).
#
# Content-Security-Policy — the XSS containment layer. If a script ever
# gets injected (a comment, a lab note, a profile field, a compromised
# dependency), this is what stops it loading code from an attacker's
# server or posting stolen data anywhere. Every host below is one the
# site genuinely uses; anything else is refused by the browser.
#
# Two deliberate weakenings, both forced by how the site is built:
#
#   'unsafe-inline' — pages carry large inline <script> and style
#     blocks (the quiz, the shop, the home page). Removing this needs
#     per-request nonces, which static hosting can't issue.
#
#   ('unsafe-eval' was removed on 17 Sep 2026 — /community now ships
#     precompiled JS from scripts/build-community.cjs instead of
#     compiling JSX in the browser. Historic note below.)
#
#   'unsafe-eval' — /community compiles its JSX in the browser with
#     Babel standalone, which is eval. Precompiling the portal at build
#     time is what removes this; until then the policy would break the
#     member portal without it. NOTE: a single policy is applied to
#     every path on purpose — Netlify applies ALL matching header rules,
#     and two CSP headers are enforced as their intersection, so a
#     "looser rule for /community" would not do what it looks like.
#
# Even weakened, this blocks the attacks that matter most here: loading
# a script from an unknown host, and exfiltrating data to one.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(self), payment=(self)"
#
# Map hosts: the licensed foraging basemap (VITE_ARCGIS_API_KEY) loads its
# style from basemapstyles-api, vector tiles + fonts from basemaps-api and
# basemaps, and imagery from ibasemaps-api (Esri service-data docs).
# api.bigdatacloud.net is deliberately absent: the browser must never call
# it with raw coordinates; /api/reverse-geocode rounds and proxies (C-04).
    Content-Security-Policy   = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://unpkg.com https://cdn.jsdelivr.net https://www.instagram.com https://platform.instagram.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://cyhpvsyvxzfadtyvcuwp.supabase.co wss://cyhpvsyvxzfadtyvcuwp.supabase.co https://api.stripe.com https://api.coingecko.com https://basemapstyles-api.arcgis.com https://basemaps-api.arcgis.com https://basemaps.arcgis.com https://ibasemaps-api.arcgis.com https://server.arcgisonline.com https://services.arcgisonline.com https://a.basemaps.cartocdn.com https://b.basemaps.cartocdn.com https://c.basemaps.cartocdn.com https://d.basemaps.cartocdn.com https://basemaps.cartocdn.com https://polygon-rpc.com https://www.instagram.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://js.stripe.com https://www.instagram.com; upgrade-insecure-requests"

# Force browsers to revalidate the favicon — avoids stale cached icons persisting across deploys
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/fungai-art-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

